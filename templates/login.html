{% extends "base.html" %}
{% block title %}Login · Hospital Analytics{% endblock %}
{% block content %}
<div class="row justify-content-center align-items-center login-area">
  <div class="col-md-6 col-lg-5">
    <div class="card shadow-sm border-0">
      <div class="card-body p-4 p-md-5">
        <h1 class="h3 mb-2">Sign in</h1>
        <p class="text-secondary mb-4">Access the hospital operations analytics dashboard.</p>
        <form method="post">
          <div class="mb-3">
            <label class="form-label" for="username">Username</label>
            <input class="form-control" id="username" name="username" autocomplete="username" required>
          </div>
          <div class="mb-4">
            <label class="form-label" for="password">Password</label>
            <input class="form-control" type="password" id="password" name="password" autocomplete="current-password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">Login</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
